{{- /*
CRDs are generated by controller-gen into _crds/, this wrapper is maintained by hand.
Rendering them as templates lets helm upgrade apply schema changes. The keep annotation preserves CRDs and their custom resources on uninstall.
Disable crds.enabled to manage them separately.
*/ -}}
{{- if .Values.crds.enabled }}
{{- range $path, $_ := .Files.Glob "_crds/*.yaml" }}
{{- /* controller-gen emits one CRD per file, optionally with a leading document marker. */}}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- if $crd.kind }}
{{- $_ := set $crd "metadata" (default dict $crd.metadata) }}
{{- $_ := set $crd.metadata "annotations" (merge (default dict $crd.metadata.annotations) (dict "helm.sh/resource-policy" "keep")) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
{{- end }}
