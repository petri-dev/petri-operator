version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - depguard
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - fatcontext
    - ginkgolinter
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - intrange
    - lll
    - logcheck
    - misspell
    - modernize
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    gocritic:
      disabled-checks:
        - appendAssign
        - dupImport
        - ifElseChain
        - octalLiteral
        - typeDefFirst
        - unnamedResult
        - whyNoLint
        - unnecessaryBlock
        - rangeValCopy
        - hugeParam
        - commentedOutCode
        - emptyStringTest
        - singleCaseSwitch
        - nestingReduce
        - tooManyResultsChecker
      enabled-tags:
        - diagnostic
        - experimental
        - performance
    gosec:
      excludes:
        - G307
        - G108
        - G401
        - G505
        - G402
        - G404
        - G101
        - G306
        - G704
        - G705
    misspell:
      ignore-rules:
        - creater
    modernize:
      disable:
        - omitzero
        - newexpr
    nolintlint:
      require-specific: true
      allow-unused: false
    paralleltest:
      check-cleanup: true
    revive:
      confidence: 0.6
      rules:
        - name: comment-spacings
        - name: context-keys-type
        - name: duplicated-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
        - name: bool-literal-in-expr
        - name: constant-logical-expr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: test/e2e/*
      - linters:
          - staticcheck
        text: QF1008
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
      - listers
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: disable
    paths:
      - third_party$
      - builtin$
      - examples$
