version: 2

project_name: petri-operator

before:
  hooks:
    - go mod tidy
    - make manifests generate
    - bash -c 'kustomize build config/crd > /tmp/crds.yaml'

builds:
  - id: operator
    main: ./cmd/operator
    binary: operator
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/petri-dev/petri-operator/internal/version.Version={{.Version}}
      - -X github.com/petri-dev/petri-operator/internal/version.Commit={{.Commit}}

  - id: deployer
    main: ./cmd/deployer
    binary: deployer
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/petri-dev/petri-operator/internal/version.Version={{.Version}}
      - -X github.com/petri-dev/petri-operator/internal/version.Commit={{.Commit}}

dockers:
  - id: operator-amd64
    ids: [operator]
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - ghcr.io/petri-dev/petri-operator:{{.Tag}}-amd64
    build_flag_templates:
      - --build-arg=BIN=operator
      - --platform=linux/amd64
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.revision={{.Commit}}
      - --label=org.opencontainers.image.source=https://github.com/petri-dev/petri-operator

  - id: operator-arm64
    ids: [operator]
    use: buildx
    dockerfile: Dockerfile.release
    goarch: arm64
    image_templates:
      - ghcr.io/petri-dev/petri-operator:{{.Tag}}-arm64
    build_flag_templates:
      - --build-arg=BIN=operator
      - --platform=linux/arm64
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.revision={{.Commit}}
      - --label=org.opencontainers.image.source=https://github.com/petri-dev/petri-operator

  - id: deployer-amd64
    ids: [deployer]
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - ghcr.io/petri-dev/petri-deployer:{{.Tag}}-amd64
    build_flag_templates:
      - --build-arg=BIN=deployer
      - --platform=linux/amd64
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.revision={{.Commit}}
      - --label=org.opencontainers.image.source=https://github.com/petri-dev/petri-operator

  - id: deployer-arm64
    ids: [deployer]
    use: buildx
    dockerfile: Dockerfile.release
    goarch: arm64
    image_templates:
      - ghcr.io/petri-dev/petri-deployer:{{.Tag}}-arm64
    build_flag_templates:
      - --build-arg=BIN=deployer
      - --platform=linux/arm64
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.revision={{.Commit}}
      - --label=org.opencontainers.image.source=https://github.com/petri-dev/petri-operator

docker_manifests:
  - name_template: ghcr.io/petri-dev/petri-operator:{{.Tag}}
    image_templates:
      - ghcr.io/petri-dev/petri-operator:{{.Tag}}-amd64
      - ghcr.io/petri-dev/petri-operator:{{.Tag}}-arm64

  - name_template: ghcr.io/petri-dev/petri-operator:latest
    image_templates:
      - ghcr.io/petri-dev/petri-operator:{{.Tag}}-amd64
      - ghcr.io/petri-dev/petri-operator:{{.Tag}}-arm64

  - name_template: ghcr.io/petri-dev/petri-deployer:{{.Tag}}
    image_templates:
      - ghcr.io/petri-dev/petri-deployer:{{.Tag}}-amd64
      - ghcr.io/petri-dev/petri-deployer:{{.Tag}}-arm64

  - name_template: ghcr.io/petri-dev/petri-deployer:latest
    image_templates:
      - ghcr.io/petri-dev/petri-deployer:{{.Tag}}-amd64
      - ghcr.io/petri-dev/petri-deployer:{{.Tag}}-arm64

archives:
  - id: operator
    ids: [operator]
    name_template: petri-operator_{{.Version}}_{{.Os}}_{{.Arch}}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: true
  name_template: "v{{.Version}}"
  extra_files:
    - glob: /tmp/crds.yaml
