apiVersion: core.petri.run/v1alpha1
kind: EnvironmentTemplate
metadata:
  name: multi-svc
  namespace: default
spec:
  ingress:
    domain: example.com
  components:
    - name: postgres
      helm:
        repo: https://charts.bitnami.com/bitnami
        chart: nginx
        version: "25.0.15"
    - name: api
      dependsOn: [postgres]
      helm:
        repo: https://charts.bitnami.com/bitnami
        chart: nginx
        version: "25.0.15"
    - name: frontend
      dependsOn: [api]
      helm:
        repo: https://charts.bitnami.com/bitnami
        chart: nginx
        version: "25.0.15"
---
apiVersion: core.petri.run/v1alpha1
kind: EphemeralEnvironment
metadata:
  name: pr-123
  namespace: default
spec:
  template: multi-svc
  source:
    repo: https://github.com/example/app
    branch: feature-123
