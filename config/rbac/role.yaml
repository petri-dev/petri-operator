---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - core.petri.run
  resources:
  - sharedcomponents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.petri.run
  resources:
  - sharedcomponents/finalizers
  verbs:
  - update
- apiGroups:
  - core.petri.run
  resources:
  - sharedcomponents/status
  verbs:
  - get
  - patch
  - update
